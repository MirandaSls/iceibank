spring.application.name=iceibank-agencia
iceibank.agencia.id=${AGENCIA_ID:0}
iceibank.dados.pasta=data

# Chave usada para assinar os JWT. As 3 agencias precisam compartilhar a mesma chave.
# Em producao viria de variavel de ambiente/cofre de segredos, nunca versionada no repositorio.
iceibank.jwt.segredo=${ICEIBANK_JWT_SECRET:iceibank-sprint1-chave-de-desenvolvimento-256-bits}
iceibank.jwt.validade-minutos=15
iceibank.jwt.validade-servico-segundos=30

server.error.include-message=always
