spring.application.name=iceibank-agencia
iceibank.agencia.id=${AGENCIA_ID:0}
iceibank.dados.pasta=data

# Chave usada para assinar os JWT. As 3 agencias precisam compartilhar a mesma chave.
# Em producao viria de variavel de ambiente/cofre de segredos, nunca versionada no repositorio.
iceibank.jwt.segredo=${ICEIBANK_JWT_SECRET:iceibank-sprint1-chave-de-desenvolvimento-256-bits}
iceibank.jwt.validade-minutos=15

# RabbitMQ (Sprint 2). Local: amqp://guest:guest@localhost:5672. CloudAMQP: defina RABBITMQ_URL
# com a "AMQP URL" da instancia (amqps://usuario:senha@host.cloudamqp.com/vhost) antes de subir.
spring.rabbitmq.uri=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.connection-timeout=3s
# Mensagem rejeitada nao volta para a fila: vai para a dead-letter queue (ver MensageriaConfig).
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Falso apenas nos testes automatizados, que nao dependem de um broker no ar.
iceibank.mensageria.habilitada=true

server.error.include-message=always
